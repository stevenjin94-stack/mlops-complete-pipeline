name: MLOps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    name: Run Tests

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare dataset
        run: |
          python -m src.prepare_data

      - name: Diagnose dataset and package versions
        run: |
          md5sum data/raw/employee_attrition.csv
          python -c "import pandas, numpy, sklearn; print('pandas:', pandas.__version__); print('numpy:', numpy.__version__); print('scikit-learn:', sklearn.__version__)"
          python -c "import pandas as pd; df=pd.read_csv('data/raw/employee_attrition.csv'); print('Dataset shape:', df.shape); print('Attrition counts:'); print(df['Attrition'].value_counts(dropna=False))"

      - name: Run pytest
        run: |
          pytest tests/ -v


  train:
    name: Train Model

    needs: test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare dataset
        run: |
          python -m src.prepare_data

      - name: Train model
        run: |
          python -m src.train --config configs/config.yaml

      - name: Verify drift monitoring script
        run: |
          python -m src.monitor_drift --config configs/config.yaml
